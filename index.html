<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#081014" />
  <meta name="description" content="Scoot Scoring - online scoring freestyle kolobezkovych zavodu" />
  <title>Scoot Scoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="toast" class="toast"></div>
  <header class="topbar">
    <a class="brand" href="#live" aria-label="Scoot Scoring">
      <span class="brand-mark">S</span>
      <span><b>SCOOT</b><em>SCORING</em></span>
    </a>
    <nav id="mainNav" class="main-nav">
      <a href="#events" data-route="events">Závody</a>
      <a href="#live" data-route="live">Live</a>
      <a href="#startlist" data-route="startlist">Startovka</a>
      <a href="#registration" data-route="registration">Přihláška</a>
      <a href="#login" class="nav-login" data-route="login">Přihlásit</a>
    </nav>
    <button id="navToggle" class="nav-toggle" aria-label="Menu">☰</button>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div><b>SCOOT SCORING</b> <span>• online scoring pro freestyle koloběžky</span></div>
    <div id="modeBadge" class="mode-badge"></div>
  </footer>

  <template id="modalTemplate">
    <div class="modal-backdrop" data-modal-close>
      <div class="modal-card" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
        <div class="modal-head"><h3 id="modalTitle">Dialog</h3><button class="icon-btn" data-modal-close>✕</button></div>
        <div id="modalBody"></div>
      </div>
    </div>
  </template>

  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
